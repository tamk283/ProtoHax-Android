name: Build APK
on:
  push:
    branches: [ stable, main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ProtoHax core
        uses: actions/checkout@v4
        with:
          repository: tamk283/ProtoHax
          ref: stable
          # NOTE: submodules disabled on purpose — the pinned submodule
          # mccheatz/mcpedata no longer exists (org deleted, repo 404).
          # The data is fetched from a mirror in the next step instead.
          submodules: false
          path: ProtoHax
      - name: Fetch mcpedata (submodule mirror)
        # Original submodule url https://github.com/mccheatz/mcpedata.git is dead;
        # CloudPixel-Studio/mcpedata carries the same layout
        # (blocks/canonical_block_states_*.nbt.gz, items, *.json, legacy_block_states.nbt.gz).
        working-directory: ProtoHax/src/main/resources/assets
        run: |
          rm -rf mcpedata
          git clone --depth 1 https://github.com/CloudPixel-Studio/mcpedata.git mcpedata
          ls mcpedata
      - name: Set up JDK 17
        # AGP 8.0.2 requires JDK 17 to run; the ProtoHax core still compiles
        # against Java 11 via kotlin.jvmToolchain(11), which auto-provisions JDK 11.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Publish ProtoHax core to mavenLocal
        working-directory: ProtoHax
        run: chmod +x ./gradlew && ./gradlew publishToMavenLocal --no-daemon --stacktrace
      - name: Checkout ProtoHax-Android
        uses: actions/checkout@v4
        with:
          path: ProtoHax-Android
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant gradlew execute
        working-directory: ProtoHax-Android
        run: chmod +x ./gradlew
      - name: Build debug APK
        working-directory: ProtoHax-Android
        run: ./gradlew app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProtoHax-Android-debug-apk
          path: ProtoHax-Android/app/build/outputs/apk/debug/*.apk
